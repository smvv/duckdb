name: Main
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/duckdb/duckdb-ci/manylinux_2_28_amd64_main:20261125-2939f510
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: duckdb/duckdb
          ref: 849f47c5eafac4af274ebd609fd147c0a9eac0b1
          path: source
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: duckdb/duckdb
          run-id: 45803483310
          name: duckdb-static-libs-linux-amd64.tar.gz
          path: repro/libs
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: duckdb/duckdb
          run-id: 45803483310
          name: core-extensions-linux-amd64
          path: repro/extensions
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: duckdb/duckdb
          run-id: 45803483310
          name: release-core-extensions-linux-amd64
          path: repro/release-extensions
      - name: Compile a probe against the CI static libraries
        shell: bash
        run: |
          dnf install -y gdb
          tar -xzf repro/libs/duckdb-static-libs-linux-amd64.tar.gz -C repro/libs
          clang++ -g -O0 -std=c++17 -Irepro/libs scripts/ci/autocomplete_probe.cpp -Wl,--start-group repro/libs/*.a -Wl,--end-group -ldl -lpthread -o repro/probe
          find repro -name autocomplete.duckdb_extension -o -name libduckdb_static.a
      - name: Capture a backtrace for each autocomplete binary
        shell: bash
        run: |
          while IFS= read -r extension; do
            echo "Testing $extension"
            # shellcheck disable=SC2016
            gdb -batch -ex run -ex 'thread apply all bt 24' -ex 'info registers' -ex 'x/12i $pc-20' --args repro/probe "$PWD/$extension" || true
          done < <(find repro -name autocomplete.duckdb_extension)
